spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/claudeproxy}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update          # auto-creates / migrates tables on startup
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  thymeleaf:
    encoding: UTF-8
    mode: HTML
    cache: false                # disable in dev; set true in prod
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

# ── Application settings ──────────────────────────────────────────────────────
app:
  auth:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:changeme}   # change this!
  jwt:
    secret: ${JWT_SECRET:claude-proxy-secret-key-change-this-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:2592000000}   # 30 days
  mail:
    enabled: ${MAIL_ENABLED:false}
    to: ${MAIL_TO:}

# ── Anthropic SDK ─────────────────────────────────────────────────────────────
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.claudeproxy: INFO
    org.springframework.security: WARN
