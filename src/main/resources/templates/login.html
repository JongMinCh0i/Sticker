<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Claude Proxy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
        .login-card { border: none; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="container" style="max-width: 380px;">
    <div class="card login-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h5 class="fw-bold mb-1">Claude Proxy</h5>
                <small class="text-muted">내부망 AI 브리지</small>
            </div>

            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <input type="text" id="username" class="form-control"
                           placeholder="사용자명" required autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control"
                           placeholder="비밀번호" required autocomplete="current-password">
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                    로그인
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');

        btn.disabled = true;
        btn.textContent = '로그인 중...';
        errorAlert.classList.add('d-none');

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                const data = await res.json().catch(() => ({}));
                errorAlert.textContent = data.error || '로그인에 실패했습니다';
                errorAlert.classList.remove('d-none');
            }
        } catch (err) {
            errorAlert.textContent = '서버와 연결할 수 없습니다';
            errorAlert.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            btn.textContent = '로그인';
        }
    });
</script>
</body>
</html>
