<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${room.title} + ' - Claude Proxy'">대화 - Claude Proxy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        html, body { height: 100%; margin: 0; }

        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 700px;
            margin: 0 auto;
        }

        .chat-header {
            flex-shrink: 0;
            padding: 10px 16px;
            border-bottom: 1px solid #dee2e6;
            background: white;
        }

        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8f9fa;
        }

        .message-row-user    { display: flex; justify-content: flex-end;   margin-bottom: 10px; }
        .message-row-assistant { display: flex; justify-content: flex-start; margin-bottom: 10px; }

        .bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }
        .bubble-user      { background: #0d6efd; color: white;  border-bottom-right-radius: 4px; }
        .bubble-assistant { background: white;   color: #212529; border-bottom-left-radius: 4px;
                            box-shadow: 0 1px 3px rgba(0,0,0,.1); }

        .input-area {
            flex-shrink: 0;
            padding: 10px 16px;
            border-top: 1px solid #dee2e6;
            background: white;
        }

        .thinking-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%; background: #adb5bd;
            animation: bounce 1.2s infinite;
        }
        .dot:nth-child(2) { animation-delay: .2s; }
        .dot:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40%           { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

<div class="chat-wrapper">
    <!-- Header -->
    <div class="chat-header d-flex align-items-center gap-2">
        <a href="/" class="btn btn-sm btn-outline-secondary"
           sec:authorize="isAuthenticated()">← 목록</a>
        <span class="fw-semibold text-truncate flex-grow-1" th:text="${room.title}">제목</span>
        <!-- "읽기 전용" badge for unauthenticated viewers -->
        <span class="badge bg-secondary" sec:authorize="!isAuthenticated()">읽기 전용</span>
    </div>

    <!-- Message list -->
    <div id="messageList" class="message-list">
        <!-- Server-rendered initial messages -->
        <div th:each="msg : ${messages}"
             th:classappend="${msg.role == 'user'} ? 'message-row-user' : 'message-row-assistant'"
             th:attr="data-id=${msg.id}">
            <div th:classappend="${msg.role == 'user'} ? 'bubble bubble-user' : 'bubble bubble-assistant'"
                 th:text="${msg.content}">
            </div>
        </div>
    </div>

    <!-- Input area — only rendered for authenticated users (Thymeleaf sec:authorize) -->
    <div class="input-area" sec:authorize="isAuthenticated()">
        <div id="thinkingRow" class="message-row-assistant d-none">
            <div class="bubble bubble-assistant thinking-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <div class="d-flex gap-2">
            <textarea id="msgInput" class="form-control" rows="2"
                      placeholder="메시지를 입력하세요… (Shift+Enter로 줄 바꿈)"
                      style="resize: none;"></textarea>
            <button id="sendBtn" class="btn btn-primary px-3" onclick="sendMessage()">전송</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*[- Chat room ID injected by Thymeleaf -]*/
    const CHAT_ROOM_ID = /*[[${chatRoomId}]]*/ '';

    // Track how many messages are currently shown
    let knownCount = document.querySelectorAll('#messageList [data-id]').length;
    let isSending  = false;

    const listEl      = document.getElementById('messageList');
    const inputEl     = document.getElementById('msgInput');
    const sendBtnEl   = document.getElementById('sendBtn');
    const thinkingEl  = document.getElementById('thinkingRow');

    // ── Helpers ──────────────────────────────────────────────────────────────

    function scrollBottom() {
        listEl.scrollTop = listEl.scrollHeight;
    }

    function buildBubble(msg) {
        const row = document.createElement('div');
        row.className = msg.role === 'user' ? 'message-row-user' : 'message-row-assistant';
        row.setAttribute('data-id', msg.id);

        const bubble = document.createElement('div');
        bubble.className = msg.role === 'user' ? 'bubble bubble-user' : 'bubble bubble-assistant';
        bubble.textContent = msg.content;

        row.appendChild(bubble);
        return row;
    }

    function renderAll(messages) {
        // Keep existing rendered messages, only append new ones
        const existingIds = new Set(
            [...listEl.querySelectorAll('[data-id]')].map(el => el.getAttribute('data-id'))
        );
        messages.forEach(msg => {
            if (!existingIds.has(msg.id)) {
                listEl.appendChild(buildBubble(msg));
            }
        });
        knownCount = messages.length;
        scrollBottom();
    }

    // ── Send message ─────────────────────────────────────────────────────────

    async function sendMessage() {
        if (!inputEl) return;  // Not authenticated — element not in DOM
        const content = inputEl.value.trim();
        if (!content || isSending) return;

        isSending = true;
        inputEl.disabled = true;
        sendBtnEl.disabled = true;
        thinkingEl && thinkingEl.classList.remove('d-none');
        scrollBottom();

        // Optimistic: show user bubble immediately
        const optimisticRow = buildBubble({id: '__optimistic__', role: 'user', content});
        listEl.appendChild(optimisticRow);
        inputEl.value = '';
        scrollBottom();

        try {
            const res = await fetch(`/api/chat/${CHAT_ROOM_ID}/messages`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content})
            });

            // Remove optimistic bubble before re-rendering
            optimisticRow.remove();

            if (res.ok) {
                const data = await res.json();
                renderAll(data.messages);
            } else if (res.status === 401) {
                window.location.href = '/login';
            } else {
                const data = await res.json().catch(() => ({}));
                alert('오류: ' + (data.error || '메시지 전송에 실패했습니다'));
            }
        } catch (err) {
            optimisticRow.remove();
            alert('네트워크 오류가 발생했습니다. 다시 시도해 주세요.');
        } finally {
            isSending = false;
            if (inputEl) inputEl.disabled = false;
            if (sendBtnEl) sendBtnEl.disabled = false;
            thinkingEl && thinkingEl.classList.add('d-none');
            if (inputEl) inputEl.focus();
        }
    }

    // ── Keyboard shortcut: Enter to send, Shift+Enter for newline ────────────

    inputEl && inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ── Polling (for PC internal-network viewer) ─────────────────────────────
    // Polls every 3 s; only fetches when not currently sending a message.

    async function poll() {
        if (isSending) return;
        try {
            const res = await fetch(`/api/chat/${CHAT_ROOM_ID}/messages`);
            if (!res.ok) return;
            const data = await res.json();
            if (data.messages.length !== knownCount) {
                renderAll(data.messages);
            }
        } catch (_) { /* network hiccup — skip */ }
    }

    setInterval(poll, 3000);

    // Initial scroll to bottom
    scrollBottom();
</script>
</body>
</html>
