<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대화 목록 - Claude Proxy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
        .room-item:hover { background: #f0f4ff; }
        .badge-role { font-size: .7rem; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 600px;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h5 class="mb-0 fw-bold">Claude Proxy</h5>
            <small class="text-muted">내부망 AI 브리지</small>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="logout()">로그아웃</button>
    </div>

    <!-- New Chat button -->
    <button class="btn btn-primary w-100 mb-4 py-2" onclick="createChat()">
        + 새 대화 시작
    </button>

    <!-- Chat room list -->
    <div th:if="${rooms.empty}" class="text-center text-muted py-5">
        <p>아직 대화가 없습니다.<br>새 대화를 시작해보세요.</p>
    </div>

    <div class="list-group" th:unless="${rooms.empty}">
        <a th:each="room : ${rooms}"
           th:href="@{/chat/{id}(id=${room.id})}"
           class="list-group-item list-group-item-action room-item rounded mb-2 border">
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-medium text-truncate me-2" th:text="${room.title}">제목</span>
                <small class="text-muted text-nowrap"
                       th:text="${#temporals.format(room.updatedAt, 'MM/dd HH:mm')}">시간</small>
            </div>
        </a>
    </div>
</div>

<script>
    async function createChat() {
        try {
            const res = await fetch('/api/chat', {method: 'POST'});
            if (res.ok) {
                const data = await res.json();
                window.location.href = `/chat/${data.id}`;
            } else if (res.status === 401) {
                window.location.href = '/login';
            } else {
                alert('대화방 생성에 실패했습니다');
            }
        } catch (err) {
            alert('서버와 연결할 수 없습니다');
        }
    }

    async function logout() {
        await fetch('/api/auth/logout', {method: 'POST'}).catch(() => {});
        window.location.href = '/login';
    }
</script>
</body>
</html>
